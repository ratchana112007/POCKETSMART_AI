{% extends "base.html" %}

{% block title %}
Jewelry Planner
{% endblock %}

{% block content %}

<div class="form-card wide">

    <h1>
        Jewelry Planner
    </h1>


    <form
        method="post"
        action="/recommendations/jewelry"
        data-validate
    >

        <label>

            Budget

            <input
                type="number"
                name="budget"
                min="1"
                step="0.01"
                required
            >

        </label>


        <label>

            Jewelry type

            <select
                name="jewelry_type"
                required
            >

                <option>
                    Ring
                </option>

                <option>
                    Necklace
                </option>

                <option>
                    Bracelet
                </option>

                <option>
                    Earrings
                </option>

                <option>
                    Chain
                </option>

                <option>
                    Pendant
                </option>

            </select>

        </label>


        <label>

            Occasion

            <input
                name="occasion"
                placeholder="Wedding, gift, daily wear..."
                required
            >

        </label>


        <label>

            Metal preference

            <input
                name="metal_preference"
                placeholder="Gold, silver, platinum..."
                required
            >

        </label>


        <label>

            Style

            <input
                name="style"
                placeholder="Minimal, classic, contemporary..."
                required
            >

        </label>


        <label>

            Gender

            <input
                name="gender"
                required
            >

        </label>


        <label>

            Additional requirements

            <textarea
                name="additional_requirements"
            ></textarea>

        </label>


        <button
            class="button"
            type="submit"
        >
            Generate Recommendation
        </button>

    </form>

</div>

{% endblock %}
